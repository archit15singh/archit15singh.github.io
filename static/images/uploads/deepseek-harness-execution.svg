<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">DeepSeek Harness: from inbox to recorded observation</title><desc id="desc">Task inbox flows through context assembly and prepared model invocation. Assistant tool calls reach guarded execution and tool providers. Results enter the session event log and the next derived request. A final answer without tool calls completes the step. Optional compaction and persistence are separate plugins.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#83d9c5"/></marker></defs><rect width="1200" height="960" fill="#101820"/><g font-family="Arial,sans-serif" fill="#f3f5f7"><text x="55" y="60" font-size="31" font-weight="700">The model is one boundary inside the agent</text><text x="55" y="93" font-size="17" fill="#a9bac9">DeepSeek Harness · pinned source 687f282e8625 · default driver</text><rect x="55" y="140" width="500" height="86" rx="12" fill="#1c2b38" stroke="#456072"/><text x="75" y="173" font-size="21" font-weight="700">1  Task inbox → turn/start</text><text x="75" y="201" font-size="16" fill="#c3d0da">followup / claim / agent-loop: turn()</text><rect x="55" y="270" width="500" height="86" rx="12" fill="#1c2b38" stroke="#456072"/><text x="75" y="303" font-size="21" font-weight="700">2  Assemble + admit context</text><text x="75" y="331" font-size="16" fill="#c3d0da">systemPrompt.assemble / agent/pre-step</text><rect x="55" y="400" width="500" height="86" rx="12" fill="#1c2b38" stroke="#456072"/><text x="75" y="433" font-size="21" font-weight="700">3  Build model request</text><text x="75" y="461" font-size="16" fill="#c3d0da">prepareCall / logged inputs / deriveMessages</text><rect x="695" y="400" width="450" height="86" rx="12" fill="#1c2b38" stroke="#456072"/><text x="715" y="433" font-size="21" font-weight="700">LLM adapter → streamed inference</text><text x="715" y="461" font-size="16" fill="#c3d0da">AssistantStreamAttempt → assistant/message</text><rect x="695" y="550" width="450" height="86" rx="12" fill="#1c2b38" stroke="#456072"/><text x="715" y="583" font-size="21" font-weight="700">4  Guard + dispatch tool calls</text><text x="715" y="611" font-size="16" fill="#c3d0da">tool/call → policy → guards → tool body</text><rect x="695" y="700" width="450" height="86" rx="12" fill="#1c2b38" stroke="#456072"/><text x="715" y="733" font-size="21" font-weight="700">Filesystem / shell provider</text><text x="715" y="761" font-size="16" fill="#c3d0da">Concrete effect; sandbox and job policy</text><rect x="55" y="700" width="500" height="86" rx="12" fill="#1c2b38" stroke="#456072"/><text x="75" y="733" font-size="21" font-weight="700">5  Record observation</text><text x="75" y="761" font-size="16" fill="#c3d0da">tool/result → next step</text><path d="M305,226 L305,270" fill="none" stroke="#83d9c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M305,356 L305,400" fill="none" stroke="#83d9c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M555,443 L695,443" fill="none" stroke="#83d9c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M920,486 L920,550" fill="none" stroke="#83d9c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M920,636 L920,700" fill="none" stroke="#83d9c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M695,743 L555,743" fill="none" stroke="#83d9c5" stroke-width="3" marker-end="url(#arrow)"/><path d="M55,743 L25,743 L25,443 L55,443" fill="none" stroke="#83d9c5" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="582" font-size="18" fill="#83d9c5">Session events → derived request surface</text><text x="65" y="615" font-size="16" fill="#a9bac9">Optional persistence stores session history.</text><text x="65" y="642" font-size="16" fill="#a9bac9">Compaction changes the admitted surface.</text><text x="695" y="825" font-size="17" fill="#c3d0da">No tool calls → step completed*</text><text x="55" y="885" font-size="17" fill="#c3d0da">Controlled reference: echo("ping") → "echo: ping" → second request → "done"</text><text x="55" y="920" font-size="15" fill="#a9bac9">*Turn stopping still considers queued messages and hooks. Diagram omits exceptional paths.</text></g></svg>