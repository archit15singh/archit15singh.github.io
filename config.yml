baseURL: "https://archit15singh.github.io/"
languageCode: "en-us"
title: "Archit's Space"
pagination:
  pagerSize: 10
theme: hugo-PaperMod

params:
  # General Settings
  DateFormat: "January 2, 2006"
  env: production
  description: "Engineer building reliable AI-agent and security systems. Memory, deterministic constraints, evaluation, and observability — not just better prompts. Memori, Luffy, GitHub."
  author: "Archit Singh"
  defaultTheme: auto
  comments: false
  disableScrollToTop: true
  image_format: "webp"
  goatcounter: "architsingh"

  # Text-to-speech: "Listen to this post" player (Web Speech API)
  tts:
    enabled: true

  # SEO Settings
  metaDescription: "Archit Singh — engineer building reliable AI-agent and security systems. Research in agent memory, agent reliability, AI security, and enterprise systems. Evidence on GitHub."
  canonicalURL: "https://archit15singh.github.io/"

  # Display Settings
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  images: ["papermod-cover.png"]

  # Features
  ShowShareButtons: true

  # Profile Mode
  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"

  # Home Info
  homeInfoParams:
    Title: "AI Agents × Security × Systems"
    Content: >
      I'm Archit Singh, an engineer building reliable AI-agent and security systems.
      I believe AI systems need memory, deterministic constraints, evaluation, and observability — not just better prompts.
      I built [Memori](https://github.com/archit15singh/memori) and [Luffy](https://github.com/archit15singh/luffy-pr-review-agent).
      I research [agent memory, agent reliability, AI security, and enterprise systems](/research/).
      Evidence lives on [GitHub](https://github.com/archit15singh), in benchmarks, on [Projects](/projects/), and in the technical writing below.

  # Social Icons
  socialIcons:
    - name: github
      url: "https://github.com/archit15singh"
    - name: linkedin
      url: "https://www.linkedin.com/in/archit15singh"
    - name: x
      url: "https://x.com/archit_singh15"
    - name: stackoverflow
      url: "https://stackoverflow.com/users/6245870/archit-singh"
    - name: Rss
      url: "index.xml"

  # Assets
  assets:
    disableHLJS: true
    disableFingerprinting: false

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"

minify:
  disableXML: true
  minifyOutput: true
  disableCSS: false
  disableHTML: false
  disableJS: false
  disableJSON: false
  disableSVG: false

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Research
          url: research/
          weight: 1
        - name: Projects
          url: projects/
          weight: 2
        - name: Writing
          url: archives
          weight: 3
        - name: Speaking
          url: speaking/
          weight: 4
        - name: About
          url: about/
          weight: 5
        - name: Contact
          url: contact/
          weight: 6
        - name: Search
          url: search/
          weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

privacy:
  vimeo:
    disabled: false
    simple: true
  x:
    enableDNT: true
    simple: true
  instagram:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
